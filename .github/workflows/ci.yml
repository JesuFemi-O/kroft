name: Kroft CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - chore/**
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🦖 Install uv
        uses: astral-sh/setup-uv@v5

      - name: 📦 Install dependencies
        run: uv sync --extra dev

      - name: 🧹 Lint with Ruff
        run: uv run ruff check kroft tests

      - name: ✅ Run tests with Pytest
        run: uv run pytest
