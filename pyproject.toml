[project]
name = "kroft"
version = "0.1.0"
description = "Synthetic data generation and schema evolution simulation for testing data pipelines"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jesufemi Ogunwede", email = "ogunwedejesufemi@gmail.com" }]
requires-python = ">=3.10"
keywords = ["data", "testing", "synthetic", "schema", "etl", "cdc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Database",
]
dependencies = [
    "psycopg2-binary>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.11",
]
docs = [
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
]

[project.urls]
Repository = "https://github.com/JesuFemi-O/kroft"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=kroft --cov-report=term-missing"

[tool.ruff]
line-length = 88
